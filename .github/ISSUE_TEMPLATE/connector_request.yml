name: Connector request
description: Propose a channel, knowledge source, model, or tool connector.
body:
  - type: dropdown
    id: kind
    attributes:
      label: Connector kind
      options:
        - Channel
        - Knowledge source
        - Model
        - Tool
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: Reusable use case
      description: Explain the user outcome, not only the provider name.
    validations:
      required: true
  - type: textarea
    id: permissions
    attributes:
      label: Permissions and data boundary
      description: List read/write effects, scopes, approval flow, and retention.
    validations:
      required: true
