name: Bug report
description: Report a reproducible problem without sharing private data.
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private messages, user identifiers, or internal URLs.
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide a minimal public fixture and exact commands.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
